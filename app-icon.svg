    <stop offset="0" stop-color="#8f5bff"/><stop offset=".45" stop-color="#ff2e88"/><stop offset="1" stop-color="#ff9e4a"/>
  </linearGradient></defs>
  <rect width="128" height="128" fill="url(#sun)"/>
  <g transform="translate(64 64) scale(0.8) translate(-64 -64)"><text x="65" y="94" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="86" font-weight="800" font-style="italic" fill="#140b1f">B</text></g>
</svg>
