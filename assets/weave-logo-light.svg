<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 128" role="img" aria-labelledby="t">
  <title id="t">Weave</title>
  <rect width="470" height="128" rx="28" fill="#ffffff"/>
  <g transform="translate(16 0)"><defs>
    <linearGradient id="l1" x1="22" y1="34" x2="43" y2="94" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a3c9f5"/><stop offset="1" stop-color="#c9bbf6"/></linearGradient>
    <linearGradient id="l2" x1="43" y1="94" x2="64" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c9bbf6"/><stop offset="1" stop-color="#b5e3a1"/></linearGradient>
    <linearGradient id="l3" x1="64" y1="50" x2="85" y2="94" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b5e3a1"/><stop offset="1" stop-color="#f5a3a3"/></linearGradient>
    <linearGradient id="l4" x1="85" y1="94" x2="106" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f5a3a3"/><stop offset="1" stop-color="#9de3d0"/></linearGradient>
  </defs>
  
  <g stroke-linecap="round" fill="none">
    <!-- tramos que van POR DEBAJO del hilo -->
    <line x1="22" y1="34" x2="43" y2="94" stroke="url(#l1)" stroke-width="5"/>
    <line x1="64" y1="50" x2="85" y2="94" stroke="url(#l3)" stroke-width="5"/>
    <!-- hilo dorado: el borde oscuro hace el hueco del cruce -->
    <path d="M6 70 C 26 84, 40 64, 64 76 S 102 66, 122 78" stroke="#ffffff" stroke-width="11"/>
    <path d="M6 70 C 26 84, 40 64, 64 76 S 102 66, 122 78" stroke="#f2c94c" stroke-width="4.5"/>
    <!-- tramos que van POR ENCIMA del hilo -->
    <line x1="43" y1="94" x2="64" y2="50" stroke="#ffffff" stroke-width="11"/>
    <line x1="43" y1="94" x2="64" y2="50" stroke="url(#l2)" stroke-width="5"/>
    <line x1="85" y1="94" x2="106" y2="34" stroke="#ffffff" stroke-width="11"/>
    <line x1="85" y1="94" x2="106" y2="34" stroke="url(#l4)" stroke-width="5"/>
  </g>
  <!-- nodos: un color por familia de género (rock, soul, pop, latina, electrónica) -->
  <g stroke="#ffffff" stroke-width="3">
    <circle cx="22" cy="34" r="11" fill="#a3c9f5"/>
    <circle cx="43" cy="94" r="11" fill="#c9bbf6"/>
    <circle cx="64" cy="50" r="13" fill="#b5e3a1"/>
    <circle cx="85" cy="94" r="11" fill="#f5a3a3"/>
    <circle cx="106" cy="34" r="11" fill="#9de3d0"/>
  </g>
  <circle cx="64" cy="50" r="17.5" fill="none" stroke="#f2c94c" stroke-width="2"/>
</g>
  <!-- shortcut: texto con fuente del sistema; para usos fuera de pantalla convertir a trazos -->
  <text x="166" y="84" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="64" font-weight="600"
        letter-spacing="-1.5" fill="#191919">weave</text>
</svg>
