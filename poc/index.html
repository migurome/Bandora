<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave</title>
<link rel="icon" href="/weave-icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root { color-scheme: dark; --bg:#0f1115; --panel:#181b21; --line:#2a2e36; --text:#eceef2; --muted:#9aa0aa; --accent:#f2c94c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
svg { display: block; width: 100vw; height: 100vh; cursor: grab; }
svg:active { cursor: grabbing; }
.ui { position: fixed; top: 12px; left: 16px; right: 16px; z-index: 3; }
.ui input { padding: 12px 16px; font-size: 16px; border-radius: 999px; background: var(--panel); }
#results { position: absolute; left: 0; right: 0; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
#results:empty { display: none; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
input { width: 100%; padding: 10px 12px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; }
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#results { list-style: none; margin: 6px 0 0; }
#results li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 6px; cursor: pointer; }
#results li:hover, #results li:focus { background: var(--line); outline: none; }
#results img { width: 32px; height: 32px; border-radius: 50%; }
#results small, .muted { color: var(--muted); }
.row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
button { background: var(--line); color: var(--text); border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
button:hover { background: #3a3f49; }
button.primary { background: var(--accent); color: #111; font-weight: 600; }
#status { color: var(--text); font-size: 13px; min-height: 1.4em; margin-bottom: 4px; }
#foot { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 2; }
#foot button { padding: 4px 10px; font-size: 12px; vertical-align: middle; }
#foot button:disabled { opacity: .35; cursor: default; }
#home svg { width: 26px; height: 26px; }
/* Logo de carga: grande en el centro con el mapa vacío, pequeño en la barra si ya hay bandas */
#busy { position: fixed; z-index: 5; pointer-events: none; display: none; }
#busy.on { display: block; }
#busy svg { width: 100%; height: 100%; }  /* la regla general de svg (grafo a pantalla completa) no aplica aquí */
#busy.center { left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); }
#busy.bar { top: 17px; right: 30px; width: 38px; height: 38px; }
#busy .thread { stroke-dasharray: 26 14; animation: weave 1.2s linear infinite; }
#busy .n { animation: beat 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
#busy .n:nth-of-type(2) { animation-delay: .15s; } #busy .n:nth-of-type(3) { animation-delay: .3s; }
#busy .n:nth-of-type(4) { animation-delay: .45s; } #busy .n:nth-of-type(5) { animation-delay: .6s; }
@keyframes weave { to { stroke-dashoffset: -40; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.25); } }
@media (prefers-reduced-motion: reduce) { #busy .thread, #busy .n { animation: pulse 1.6s ease-in-out infinite; } }
#info { position: fixed; top: 0; right: 0; bottom: 0; width: 320px;  /* a toda altura; la barra se encoge para dejarle sitio */ z-index: 4; display: none; flex-direction: column; gap: 8px;
        padding: 16px; background: var(--panel); border-left: 1px solid var(--line); overflow: hidden; }
/* Ficha plegable: se desliza a la derecha y deja una pestaña para recuperarla */
#info { transition: transform .3s ease; }
body.folded #info { transform: translateX(calc(100% + 2px)); }
#fold { position: fixed; bottom: 16px; right: 320px; z-index: 4; display: none; width: 26px; height: 48px; padding: 0;
        border-radius: 8px 0 0 8px; background: var(--panel); border: 1px solid var(--line); border-right: 0;
        color: var(--muted); transition: right .3s ease; }
#fold svg { width: 16px; height: 16px; transition: transform .3s ease; }
body.panel #fold { display: grid; place-items: center; }
body.folded #fold { right: 0; }
body.folded #fold svg { transform: rotate(180deg); }
.ui, #busy.bar { transition: right .3s ease; }
body.panel:not(.folded) .ui { right: 336px; }
body.panel:not(.folded) #busy.bar { right: 350px; }
@media (prefers-reduced-motion: reduce) { #info, #fold, #fold svg { transition: none; } }
#info img { width: 100%; flex: 0 1 auto; min-height: 0; max-height: 288px; object-fit: cover; border-radius: 10px; }
#info h2 { margin: 4px 0 0; font-size: 22px; line-height: 1.2; }
#info .row { margin-top: auto; align-items: center; }
.icon { width: 38px; height: 38px; padding: 0; display: inline-grid; place-items: center; border-radius: 50%; }
.icon svg { width: 20px; height: 20px; }
.ui .bar { display: flex; gap: 8px; }
.ui select { flex: none; max-width: 220px; padding: 0 14px; background: var(--panel); color: var(--text); border: 1px solid var(--line);
             border-radius: 999px; font: inherit; cursor: pointer; }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; margin: 4px 4px 0 0; font-size: 12px; }
#legend { position: fixed; left: 16px; bottom: 16px; z-index: 2; font-size: 12px; max-width: 320px; }
#legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.node { cursor: pointer; }
/* Arco de carga que recorre el círculo mientras se busca información de la banda */
.spin { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; transform-box: fill-box; transform-origin: center;
        animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .3; } }
.node text { pointer-events: none; user-select: none; }
.link { stroke: #4a5060; stroke-opacity: .7; }
.link.path { stroke: var(--accent); stroke-width: 3; stroke-opacity: .9; }
.node, .link { transition: opacity .25s; }
.node.off { opacity: .07; pointer-events: none; }
.link.off { opacity: .04; }
#legend button { background: none; padding: 2px 6px; margin: 0 4px 2px 0; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; }
#legend button[aria-pressed="false"] { opacity: .35; text-decoration: line-through; }
/* Terminal: la barra acepta artistas y comandos (/from … to …, /clear) */
.ui .bar { position: relative; }
.ui .bar::before { content: '›'; position: absolute; left: 16px; top: 50%; transform: translateY(-52%); color: var(--accent); font-size: 22px; pointer-events: none; }
.ui input { padding-left: 38px; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
.ui input.err { border-color: #e5484d; animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
#results li.cmd { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; color: var(--muted); }
#results li.cmd b { color: var(--accent); font-weight: 600; }
.node text.under { paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
#foot button[aria-pressed="true"] { background: var(--accent); color: #111; }
#tip { position: fixed; pointer-events: none; background: #000c; padding: 6px 9px; border-radius: 6px; font-size: 12px; z-index: 3; display: none; }
</style>
</head>
<body>
<div class="ui">
  <div class="bar">
    <input id="q" autocomplete="off" spellcheck="false" aria-label="Artista o comando (/from A to B, /clear)">
  </div>
  <ul id="results"></ul>
</div>
<div id="info"></div>
<button id="fold" aria-label="Plegar o desplegar la ficha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
<div id="legend"></div>
<div id="busy" role="status" aria-label="Cargando">
  <svg viewBox="0 0 128 128">
    <g stroke-linecap="round" fill="none" stroke-width="5">
      <line x1="22" y1="34" x2="43" y2="94" stroke="#a3c9f5"/><line x1="43" y1="94" x2="64" y2="50" stroke="#c9bbf6"/>
      <line x1="64" y1="50" x2="85" y2="94" stroke="#b5e3a1"/><line x1="85" y1="94" x2="106" y2="34" stroke="#f5a3a3"/>
      <path class="thread" d="M6 70 C 26 84, 40 64, 64 76 S 102 66, 122 78" stroke="#f2c94c" stroke-width="4.5"/>
    </g>
    <g stroke="#0f1115" stroke-width="3">
      <circle class="n" cx="22" cy="34" r="11" fill="#a3c9f5"/><circle class="n" cx="43" cy="94" r="11" fill="#c9bbf6"/>
      <circle class="n" cx="64" cy="50" r="13" fill="#b5e3a1"/><circle class="n" cx="85" cy="94" r="11" fill="#f5a3a3"/>
      <circle class="n" cx="106" cy="34" r="11" fill="#9de3d0"/>
    </g>
  </svg>
</div>
<div id="foot">
  <button id="home" class="icon" title="Weave" aria-label="Encuadrar todo el mapa"></button>
  <button id="play" class="icon" aria-label="Reproducir o parar el preview" data-src=""></button>
  <button id="clear" class="icon" title="/clear" aria-label="Limpiar el mapa"></button>
  <button id="labels" class="icon" title="/label" aria-label="Mostrar u ocultar los géneros" aria-pressed="false"></button>
</div>
<div id="tip"></div>
<svg id="svg"></svg>

<script>
// Tonos pastel (Metal, Hip hop, Electrónica, Latina, Soul…, Pop, Rock)
const PALETTE = ['#f5a9c8', '#f3c6a5', '#9de3d0', '#f5a3a3', '#c9bbf6', '#b5e3a1', '#a3c9f5'];
// Familias de género, en orden fijo: cada una tiene siempre el mismo color. La primera regla que encaja gana.
const FAMILIES = [
  ['Metal', /metal|grindcore|thrash|doom/],
  ['Hip hop', /hip ?hop|rap|trap|drill|grime/],
  ['Electrónica', /electr|house|techno|trance|edm|dubstep|drum and bass|ambient|synth|^dance$|idm/],
  ['Latina / Flamenco', /latin|flamenco|rumba|salsa|reggaet|cumbia|bachata|merengue|tango|bolero|ranchera|copla|son cubano/],
  ['Soul / Funk / Jazz / Blues', /soul|funk|r&b|rhythm and blues|disco|jazz|blues|gospel|motown|swing/],
  ['Pop', /pop|dance-pop|cantautor|singer-songwriter|chanson|schlager|variété/],
  ['Rock', /rock|punk|grunge|indie|alternativ|britpop|emo|garage|shoegaze|post-|psychedel/],
];
// "blues rock", "pop rock", "hard rock"… son rock antes que su prefijo
const family = g => /rock$|rock and roll|rock urbano/.test(g) ? 'Rock' : (FAMILIES.find(([, re]) => re.test(g)) || ['Otros'])[0];
const OTHER = '#c0c6cf';
const MAX_LINKS = 5;
const ends = l => [l.source.id ?? l.source, l.target.id ?? l.target];
const degree = n => links.filter(l => ends(l).includes(n.id)).length;
const linked = (a, b) => links.some(l => { const [s, t] = ends(l); return s === a.id && t === b.id || s === b.id && t === a.id; });

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('es-ES');
const norm = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '');
const api = async url => { const r = await fetch(url); const j = await r.json(); if (j && j.error) throw new Error(j.error); return j; };
const status = () => {};  // sin mensajes de texto: el estado se comunica con iconos, colores y sonidos
function flashError() {
  const q = $('q'); q.classList.remove('err'); void q.offsetWidth; q.classList.add('err'); sfx.nope();
  setTimeout(() => q.classList.remove('err'), 900);
}

const nodes = [], links = [], byId = new Map(), byName = new Map(), cache = new Map();
// Clave por nombre normalizado: Deezer tiene fichas duplicadas ("B.B. King" / "B.B.King") con distinto id
const key = a => norm(a.name) || 'id' + a.id;
const inMap = a => byId.has(a.id) || byName.has(key(a));
const genreColor = new Map(FAMILIES.map(([f], i) => [f, PALETTE[i]]).concat([['Otros', OTHER]]));
const colorOf = g => genreColor.get(genreColor.has(g) ? g : family(g));

// ---------- Dibujo ----------
const svg = d3.select('#svg');
const root = svg.append('g');
const gLinks = root.append('g'), gNodes = root.append('g');
let k = 1;
const zoom = d3.zoom().scaleExtent([0.08, 4]).on('zoom', e => {
  if (e.sourceEvent) autoFit = false;  // el usuario ha tocado el zoom: no le movemos la vista
  root.attr('transform', e.transform);
  k = e.transform.k;
  gNodes.selectAll('text').attr('display', labelDisplay());
});
svg.call(zoom).on('dblclick.zoom', null);

const sim = d3.forceSimulation(nodes)
  // Distancia según el tamaño de los dos círculos: así no se solapan aunque lleven el nombre dentro
  .force('link', d3.forceLink(links).id(d => d.id)
    .distance(l => radius(l.source) + radius(l.target) + 70).strength(0.6))
  .force('charge', d3.forceManyBody().strength(d => -300 - 8 * radius(d)).distanceMax(700))
  .force('collide', d3.forceCollide(d => radius(d) + (photoMode ? 26 : 14)).strength(1))  // hueco para el nombre bajo la foto
  .force('gx', d3.forceX(d => anchor(d).x).strength(d => d.genre ? 0.012 : 0))
  .force('gy', d3.forceY(d => anchor(d).y).strength(d => d.genre ? 0.012 : 0))
  .force('cx', d3.forceX(() => innerWidth / 2).strength(0.008))  // las bandas sueltas no se alejan sin fin
  .force('cy', d3.forceY(() => innerHeight / 2).strength(0.012))
  .on('tick', tick)
  .on('end', () => { if (wantFit || autoFit) { wantFit = false; fitIfNeeded(); } });
let wantFit = false, autoFit = false;  // autoFit: reencuadrar mientras carga una lista, hasta que el usuario mueva el mapa
setInterval(() => { if (autoFit) fitIfNeeded(); }, 2000);

// Cada género tiene un ancla en un círculo grande: acerca entre sí las bandas del mismo estilo.
function anchor(d) {
  const present = new Set(nodes.map(n => n.genre));
  const list = [...genreColor.keys()].filter(g => present.has(g));
  const i = Math.max(0, list.indexOf(d.genre)), n = Math.max(list.length, 1);
  const R = n === 1 ? 0 : 140 + 30 * n;
  return { x: innerWidth / 2 + R * Math.cos(2 * Math.PI * i / n), y: innerHeight / 2 + R * Math.sin(2 * Math.PI * i / n) };
}
let showLabels = localStorage.getItem('weave-labels') === '1';  // géneros (leyenda): botón de etiqueta o /label
const labelDisplay = () => k < 0.6 ? 'none' : null;  // los nombres se ven siempre (salvo muy alejado)
const photoMode = true;  // los círculos muestran la foto del artista; el color del género va en el aro
function radius(d) {
  const base = 7 + Math.min(14, Math.log10((d.fans || 0) + 10) * 2.2);
  const size = d.origin ? base + 8 : base;
  return photoMode ? Math.max(size + 6, 26) : Math.max(size, label(d).r);
}

// Nombre dentro del círculo: hasta 2 líneas equilibradas; el radio cubre la caja del texto.
const ctx2d = document.createElement('canvas').getContext('2d');
const LINE_H = 12;
function label(d) {
  if (d._label && d._label.origin === d.origin) return d._label;
  const font = d.origin ? 'bold 12px system-ui, sans-serif' : '11px system-ui, sans-serif';
  ctx2d.font = font;
  const w = t => ctx2d.measureText(t).width;
  const words = d.name.split(/\s+/);
  let lines = [d.name];
  if (words.length > 1 && w(d.name) > 70) {  // parte por la palabra que mejor equilibra las dos líneas
    let best = Infinity;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
      const m = Math.max(w(a), w(b));
      if (m < best) { best = m; lines = [a, b]; }
    }
  }
  const tw = Math.max(...lines.map(w)), th = lines.length * LINE_H;
  return d._label = { lines, font, origin: d.origin, r: Math.hypot(tw / 2, th / 2) + 4 };
}

function render() {
  const l = gLinks.selectAll('line').data(links, d => d.source.id + '-' + d.target.id);
  l.exit().remove();
  l.enter().append('line').merge(l)
    .attr('class', d => 'link' + (d.path ? ' path' : '') + (hidden.has(d.source.genre) || hidden.has(d.target.genre) ? ' off' : ''));

  const n = gNodes.selectAll('g.node').data(nodes, d => d.id);
  n.exit().remove();
  const e = n.enter().append('g')
    .on('click', (ev, d) => { ev.stopPropagation(); autoFit = false; sfx.select(); select(d); })  // al interactuar, la vista deja de moverse sola
    .on('dblclick', (ev, d) => { ev.stopPropagation(); expand(d); })
    .on('mousemove', (ev, d) => tipShow(ev, d)).on('mouseleave', () => $('tip').style.display = 'none')
    .call(d3.drag()
      .on('start', (ev, d) => { if (!ev.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
      .on('end', (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = d.fy = null; }));
  e.append('circle').attr('class', 'ring');
  e.append('circle').attr('class', 'spin');
  e.append('circle').attr('class', 'dot');
  // Foto recortada en círculo (modo fotos): clipPath propio por nodo
  e.append('clipPath').attr('id', d => 'clip' + d.id).append('circle');
  e.append('image').attr('class', 'pic').attr('preserveAspectRatio', 'xMidYMid slice').attr('clip-path', d => `url(#clip${d.id})`);
  e.append('text').attr('text-anchor', 'middle').attr('class', 'in');
  const all = e.merge(n).attr('class', d => 'node' + (hidden.has(d.genre) ? ' off' : ''));
  // Sin género todavía: gris con borde punteado (se colorea una sola vez, al llegar el género)
  all.select('clipPath circle').attr('r', radius);
  all.select('.pic').attr('display', d => photoMode && d.picture ? null : 'none').attr('href', d => d.picture || null)
    .attr('x', d => -radius(d)).attr('y', d => -radius(d)).attr('width', d => 2 * radius(d)).attr('height', d => 2 * radius(d));
  // Con foto, el color del género pasa a ser un aro grueso alrededor
  all.select('.dot').attr('r', radius).attr('fill', d => d.genre ? colorOf(d.genre) : 'var(--panel)')
    .attr('stroke', d => d.selected ? '#fff' : photoMode && d.genre ? colorOf(d.genre) : d.genre ? 'none' : 'var(--muted)')
    .attr('stroke-dasharray', d => d.genre || d.selected ? null : '3 3').attr('stroke-width', d => d.selected ? 3 : photoMode ? 4 : 1.5);
  // Aro punteado = la banda ya no admite más conexiones
  all.select('.ring').attr('r', d => radius(d) + 4).attr('fill', 'none')
    .attr('stroke', d => d.exhausted ? 'var(--muted)' : 'none').attr('stroke-width', 2).attr('stroke-dasharray', '2 3');
  all.select('.spin').attr('r', d => radius(d) + 8)
    .attr('stroke-dasharray', d => { const c = 2 * Math.PI * (radius(d) + 8); return `${c * 0.28} ${c}`; })
    .attr('display', d => d.loading || (!d.genre && !d.failed) ? null : 'none');
  all.select('text').each(function (d) {
    const L = label(d);
    const under = photoMode;  // con foto, el nombre va debajo del círculo
    d3.select(this).style('font', L.font).classed('under', under).attr('fill', d.genre && !under ? '#15171c' : 'var(--text)')
      .attr('display', labelDisplay())
      .selectAll('tspan').data(L.lines).join('tspan').attr('x', 0)
      .attr('dy', (t, i) => i === 0 ? (under ? radius(d) + 16 : -(L.lines.length - 1) * LINE_H / 2 + 4) : LINE_H).text(t => t);
  });

  sim.nodes(nodes); sim.force('link').links(links); sim.alpha(0.6).restart();
  renderLegend();
}

// Si alguna banda queda fuera de la vista, encuadra todo (sin acercar más allá de 1.2×)
function fitIfNeeded(force = false) {
  if (!nodes.length) return;
  const t = d3.zoomTransform(svg.node());
  const left = 20;
  const x0 = d3.min(nodes, d => d.x - radius(d)), x1 = d3.max(nodes, d => d.x + radius(d));
  const y0 = d3.min(nodes, d => d.y - radius(d)), y1 = d3.max(nodes, d => d.y + radius(d));
  const out = nodes.some(d => { const [sx, sy] = t.apply([d.x, d.y]), r = radius(d) * t.k;  // cuenta el borde del círculo, no solo el centro
    return sx - r < left || sx + r > innerWidth - 330 || sy - r < 70 || sy + r > innerHeight - 90; });
  if (!out && !force) return;
  const w = innerWidth - 340 - left, h = innerHeight - 180;  // deja libres la barra, la pila, la ficha y el pie
  // nunca por debajo de 0.6: el encuadre automático no debe ocultar los nombres
  const s = Math.max(0.6, Math.min(1.2, 0.9 * Math.min(w / (x1 - x0 + 80), h / (y1 - y0 + 80))));
  svg.transition().duration(700).call(zoom.transform,
    d3.zoomIdentity.translate(left + w / 2, 80 + h / 2).scale(s).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
}

function tick() {
  gLinks.selectAll('line').attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  gNodes.selectAll('g.node').attr('transform', d => `translate(${d.x},${d.y})`);
}

// Leyenda = filtro: pulsar un género lo oculta o lo muestra
const hidden = new Set();
function renderLegend() {
  $('legend').style.display = showLabels ? '' : 'none';  // la leyenda (filtro de género) es una etiqueta más
  const present = new Set(nodes.map(d => d.genre));
  $('legend').innerHTML = [...genreColor].filter(([g]) => present.has(g)).map(([g, c]) =>
    `<button data-g="${esc(g)}" aria-pressed="${!hidden.has(g)}"><i style="background:${c}"></i>${esc(g)}</button>`).join('');
  $('legend').querySelectorAll('button').forEach(b => b.onclick = () => {
    const g = b.dataset.g; hidden.has(g) ? hidden.delete(g) : hidden.add(g); sfx.select(); render();
  });
}

function tipShow(ev, d) {
  $('tip').innerHTML = `<b>${esc(d.name)}</b><br>${esc(d.sub || d.genre || '…')}`;
  Object.assign($('tip').style, { display: 'block', left: ev.clientX + 14 + 'px', top: ev.clientY + 14 + 'px' });
}

// ---------- Datos ----------
async function getArtist(id) {
  if (!cache.has(id)) cache.set(id, api('/api/artist/' + id).catch(e => { cache.delete(id); throw e; }));
  return cache.get(id);
}

function addNode(a, near, origin = false) {
  let n = byId.get(a.id) || byName.get(key(a));
  if (n) { if (origin) n.origin = true; return n; }
  n = { id: a.id, name: a.name, fans: a.fans, genre: a.genres ? family(a.genres[0]) : null, sub: a.genres ? a.genres[0] : '', origin, shown: 0,
        x: near ? near.x + (Math.random() - .5) * 60 : innerWidth / 2 + (Math.random() - .5) * 200,
        y: near ? near.y + (Math.random() - .5) * 60 : innerHeight / 2 + (Math.random() - .5) * 200 };
  nodes.push(n); byId.set(a.id, n); byName.set(key(n), n);
  return n;
}
// Reparte las bandas nuevas alrededor de su origen, hacia fuera (lejos de quien trajo a esa banda)
function fanAngles(n, count) {
  const out = n.parent ? Math.atan2(n.y - n.parent.y, n.x - n.parent.x) : -Math.PI / 2;
  const arc = n.parent ? Math.PI * 1.2 : 2 * Math.PI;  // 216° hacia fuera, o círculo completo si es origen
  return Array.from({length: count}, (_, i) => n.parent ? out - arc / 2 + arc * (i + 0.5) / count : out + arc * i / count);
}
function placeAt(n, c, ang) {
  const dist = radius(n) + radius(c) + 70;
  c.x = n.x + dist * Math.cos(ang); c.y = n.y + dist * Math.sin(ang);
}
// Nodo a partir de la ficha completa: nunca entra al grafo una banda a medio cargar
function addFull(full, near, origin = false) {
  const n = addNode(full, near, origin);
  n.sub = full.genres[0]; n.genre = family(n.sub); n.picture = full.picture;
  return n;
}
function addLink(a, b) {
  if (linked(a, b)) return;
  links.push({ source: a, target: b, cross: false });
}

// Rellena el género real de un nodo en segundo plano (la primera vez tarda: MusicBrainz va a 1 petición/s)
async function hydrate(n) {
  try {
    const a = await getArtist(n.id);
    n.sub = a.genres[0];
    if (n.genre !== family(n.sub)) { n.genre = family(n.sub); render(); }
    return a;
  } catch (e) { n.failed = true; render(); status('Error con ' + n.name + ': ' + e.message); }
}

async function expand(n) {
  if (n.loading) return;
  select(n);
  n.loading = true; render();  // el arco gira en la banda que se está explorando
  const a = await hydrate(n);
  if (!a) { n.loading = false; render(); return; }
  const slots = MAX_LINKS - degree(n);
  const picks = a.related.filter(r => !inMap(r)).slice(0, Math.max(0, slots));
  const angles = fanAngles(n, picks.length);
  const fulls = picks.map(r => getArtist(r.id).catch(() => null));  // en paralelo; el servidor respeta el ritmo de cada API
  let added = 0;
  for (let i = 0; i < picks.length; i++) {
    const full = await fulls[i];
    if (!byId.has(n.id)) break;                       // la quitaron mientras cargaba
    if (!full || inMap(full) || degree(n) >= MAX_LINKS) continue;
    const c = addFull(full, n); c.parent = n;
    placeAt(n, c, angles[i]);
    addLink(n, c); added++;
    render(); sfx.join(i);
  }
  n.loading = false;
  const full = degree(n) >= MAX_LINKS;
  n.exhausted = full || !added;
  if (!added) sfx.nope();
  status(added ? '' : full ? `${n.name} no admite más conexiones` : `${n.name}: sin relacionadas nuevas`);
  render(); if (n.selected) select(n);  // refresca el botón Explorar del panel
  wantFit = true;  // encuadra cuando la simulación se asiente
}

// ---------- Sonidos (sintetizados con Web Audio, sin archivos) ----------
const sfx = (() => {
  let ctx;  // sonidos siempre activos
  // Burbuja: seno con barrido rápido de tono (sube = «pop», baja = «bloop» hacia dentro) y caída muy corta
  function bubble(freq, at = 0, ratio = 2.6, dur = 0.13, vol = 0.16) {
    ctx ??= new AudioContext();
    const f = freq * (0.92 + Math.random() * 0.16);  // variación para que no suenen idénticas
    const t = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * ratio, t + dur * 0.55);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  return {
    open: n => { for (let i = 0; i < n; i++) bubble(380 + i * 70, i * 0.075 + Math.random() * 0.02); },
    nope: () => bubble(260, 0, 0.55, 0.16, 0.14),
    remove: () => { bubble(700, 0, 0.35, 0.16); bubble(520, 0.07, 0.35, 0.16, 0.1); bubble(380, 0.14, 0.35, 0.18, 0.08); },
    select: () => bubble(900, 0, 1.8, 0.07, 0.09),
    join: i => bubble(420 + (i % 7) * 60, 0, 2.2, 0.09, 0.07),  // burbuja suave por cada artista que entra
    chord: () => { for (let i = 0; i < 7; i++) bubble(300 + i * 90, i * 0.06 + Math.random() * 0.03, 2.4, 0.12, 0.12); },
  };
})();

const ICON = {
  // Iconos simplificados: barras de ecualizador (Deezer) y ondas (Spotify)
  deezer: '<svg viewBox="0 0 24 24" fill="#a238ff"><rect x="2" y="15" width="4" height="5" rx="1"/><rect x="7" y="11" width="4" height="9" rx="1"/><rect x="12" y="7" width="4" height="13" rx="1"/><rect x="17" y="4" width="4" height="16" rx="1"/></svg>',
  spotify: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1ed760"/><g fill="none" stroke="#111" stroke-linecap="round"><path d="M6.5 9.2c3.8-1.2 7.9-.9 11 .9" stroke-width="2"/><path d="M7.2 12.6c3.1-.9 6.3-.6 8.9.8" stroke-width="1.7"/><path d="M7.8 15.7c2.4-.6 4.8-.4 6.8.6" stroke-width="1.4"/></g></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  explore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="5" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M9 12h6.5M8.5 10.5l7-4.5M8.5 13.5l7 4.5"/></svg>',
  label: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5" fill="currentColor"/></svg>',
  clear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>',
};
let shownId = null;  // artista que muestra la ficha
function showPanel(on) {
  $('info').style.display = on ? 'flex' : 'none'; document.body.classList.toggle('panel', on);
  if (!on) { shownId = null; $('play').dataset.src = ''; playIcon?.(); }
}
document.body.classList.toggle('folded', localStorage.getItem('weave-folded') === '1');
$('fold').onclick = () => {
  const folded = document.body.classList.toggle('folded');
  localStorage.setItem('weave-folded', folded ? '1' : '0'); sfx.select();
};

async function select(n) {
  nodes.forEach(m => m.selected = m === n); render();
  const a = await getArtist(n.id).catch(() => null);
  if (!a || !n.selected) return;  // si mientras cargaba se deseleccionó, no reabrir la ficha
  showPanel(true); shownId = n.id;
  $('info').innerHTML = `
    ${a.picture ? `<img src="${esc(a.picture)}" alt="">` : ''}
    <h2>${esc(a.name)}</h2>
    ${a.country ? `<div class="muted">${esc(a.country)}</div>` : ''}
    <div>${a.genres.map(g => `<span class="tag" style="border-color:${colorOf(g)}">${esc(g)}</span>`).join('')}</div>
    <div class="row"><button class="icon primary" id="more" aria-label="Explorar relacionadas" ${degree(n) >= MAX_LINKS ? 'disabled style="opacity:.4;cursor:default"' : ''}>${ICON.explore}</button>
      <a href="${esc(a.link)}" target="_blank" rel="noopener"><button class="icon" title="Abrir en Deezer" aria-label="Abrir en Deezer">${ICON.deezer}</button></a>
      <a href="https://open.spotify.com/search/${encodeURIComponent(a.name)}" target="_blank" rel="noopener"><button class="icon" title="Buscar en Spotify" aria-label="Buscar en Spotify">${ICON.spotify}</button></a>
      <button class="icon" id="del" title="Quitar (Supr)" aria-label="Quitar del mapa">${ICON.trash}</button></div>`;
  $('more').onclick = () => expand(n);
  $('del').onclick = () => removeNode(n);
  $('play').dataset.src = a.preview || '';  // el ▶ del pie reproduce el artista de la ficha
  $('play').title = a.previewTitle || '';
  playIcon();
}

// ---------- Preview: un solo reproductor para toda la página ----------
const player = new Audio();
const sounding = () => !!player.src && !player.paused;
function playIcon() {
  const b = $('play');
  b.innerHTML = sounding() ? ICON.stop : ICON.play;
  b.setAttribute('aria-pressed', sounding());
  b.disabled = !sounding() && !b.dataset.src;
}
function togglePlay() {
  const src = $('play').dataset.src;
  if (sounding()) { player.pause(); player.currentTime = 0; }
  else if (src) { player.src = src; player.play().catch(() => flashError()); }
  playIcon();
}
$('play').onclick = togglePlay;
['play', 'pause', 'ended'].forEach(ev => player.addEventListener(ev, playIcon));
playIcon();

async function addOrigin(r) {
  const full = await working(getArtist(r.id).catch(() => null));
  if (!full) { flashError(); return; }
  const n = addFull(full, null, true);
  render(); sfx.join(0); select(n);
}

// ---------- Interfaz ----------
let timer;
// Búsqueda con un resultado por artista (Deezer duplica fichas: se queda la de más fans), en orden de relevancia
async function searchArtists(q) {
  const raw = await api('/api/search?q=' + encodeURIComponent(q)).catch(() => []);
  const best = new Map();
  raw.forEach(r => { const b = best.get(key(r)); if (!b || r.fans > b.fans) best.set(key(r), r); });
  return raw.filter(r => best.get(key(r)) === r);
}
// Pinta sugerencias de artistas; onPick recibe el elegido
let suggestions = [];
function showArtists(res, onPick) {
  suggestions = res.map(r => () => onPick(r));
  $('results').innerHTML = res.map((r, i) => `<li tabindex="0" data-i="${i}">
    ${r.picture ? `<img src="${esc(r.picture)}" alt="">` : ''}<div>${esc(r.name)}</div></li>`).join('');
  $('results').querySelectorAll('li').forEach(li => {
    li.onclick = suggestions[li.dataset.i]; li.onkeydown = ev => ev.key === 'Enter' && suggestions[li.dataset.i]();
  });
}

// /from A to B: autocompleta el tramo que se está escribiendo (A antes de «to», B después)
const picked = new Map();  // nombre exacto elegido → artista, para que el comando use justo ese
function parseFrom(q) {
  const m = q.match(/^\/from\s+(.*?)(?:\s+to(?:\s+(.*))?)?$/i);
  if (!m) return null;
  return q.match(/\s+to(\s|$)/i) ? { a: m[1].trim(), b: (m[2] || '').trim(), part: 'b' } : { a: m[1].trim(), b: '', part: 'a' };
}
function suggestFrom(q) {
  const f = parseFrom(q);
  const text = f && f[f.part];
  if (!text || text.length < 2 || picked.has(text)) { $('results').innerHTML = ''; return; }
  timer = setTimeout(async () => {
    const res = await searchArtists(text);
    if ($('q').value.replace(/^\s+/, '') !== q) return;  // el usuario siguió escribiendo
    showArtists(res, r => {
      picked.set(r.name, r);
      $('q').value = f.part === 'a' ? `/from ${r.name} to ` : `/from ${f.a} to ${r.name}`;
      $('results').innerHTML = ''; $('q').focus(); sfx.select();
    });
  }, 250);
}

$('q').addEventListener('input', e => {
  clearTimeout(timer);
  const q = e.target.value.replace(/^\s+/, '');
  if (/^\/from\s/i.test(q)) { suggestFrom(q); return; }
  if (q.startsWith('/')) { showCommands(q.trim()); return; }
  if (q.trim().length < 2) { $('results').innerHTML = ''; return; }
  timer = setTimeout(async () => {
    showArtists(await searchArtists(q.trim()), r => { $('results').innerHTML = ''; $('q').value = ''; addOrigin(r); });
  }, 250);
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('q').value = ''; $('results').innerHTML = ''; return; }
  if (e.key === 'Tab' && suggestions.length && $('results').querySelector('li:not(.cmd)')) {  // Tab = aceptar la primera sugerencia
    e.preventDefault(); suggestions[0](); return;
  }
  if (e.key !== 'Enter') return;
  const v = $('q').value.trim();
  if (v.startsWith('/')) { $('results').innerHTML = ''; runCommand(v); return; }
  $('results').querySelector('li')?.click();
});

// ---------- Comandos ----------
const COMMANDS = [
  { usage: '/from <b>A</b> to <b>B</b>', fill: '/from ', re: /^\/from\s+(.+?)\s+to\s+(.+)$/i, run: m => pathByNames(m[1], m[2]) },
  { usage: '/label', fill: '/label', re: /^\/labels?$/i, run: () => toggleLabels() },
  { usage: '/clear', fill: '/clear', re: /^\/clear$/i, run: () => { listRun++; clearAll(); sfx.remove(); } },
];
function showCommands(q) {
  const word = q.split(/\s+/)[0].toLowerCase();
  const list = COMMANDS.filter(c => c.fill.trim().startsWith(word));
  $('results').innerHTML = list.map((c, i) => `<li class="cmd" tabindex="0" data-i="${i}">${c.usage}</li>`).join('');
  $('results').querySelectorAll('li').forEach(li => li.onclick = () => {
    $('q').value = list[li.dataset.i].fill; $('results').innerHTML = ''; $('q').focus();
  });
}
async function runCommand(v) {
  for (const c of COMMANDS) {
    const m = v.match(c.re);
    if (m) { $('q').value = ''; return c.run(m); }
  }
  flashError();
}
// Artista por nombre: el elegido en las sugerencias; si no, el de nombre igual; si no, el más relevante
async function findArtist(name) {
  if (picked.has(name)) return picked.get(name);
  const res = await searchArtists(name);
  return res.find(r => norm(r.name) === norm(name)) || res[0] || null;
}
async function pathByNames(a, b) {
  const [x, y] = await working(Promise.all([findArtist(a), findArtist(b)]));
  if (!x || !y) { $('q').value = `/from ${a} to ${b}`; flashError(); return; }
  runPath(x, y);
}

// Quita una banda y las que solo llegaban al mapa a través de ella (las que siguen unidas a un origen se quedan)
function removeNode(n) {
  if (!byId.has(n.id)) return;
  const rest = nodes.filter(m => m !== n);
  const restLinks = links.filter(l => !ends(l).includes(n.id));
  const adj = new Map(rest.map(m => [m.id, []]));
  restLinks.forEach(l => { const [s, t] = ends(l); adj.get(s).push(t); adj.get(t).push(s); });
  const keep = new Set(rest.filter(m => m.origin || m.inList).map(m => m.id)), queue = [...keep];
  while (queue.length) for (const id of adj.get(queue.pop())) if (!keep.has(id)) { keep.add(id); queue.push(id); }
  const gone = rest.filter(m => !keep.has(m.id));
  nodes.splice(0, nodes.length, ...rest.filter(m => keep.has(m.id)));
  links.splice(0, links.length, ...restLinks.filter(l => ends(l).every(id => keep.has(id))));
  byId.clear(); byName.clear(); nodes.forEach(m => { byId.set(m.id, m); byName.set(key(m), m); });
  nodes.forEach(m => { if (degree(m) < MAX_LINKS) m.exhausted = false; });  // quien pierde conexiones puede volver a explorar
  if (!byId.has(shownId)) showPanel(false);  // la ficha solo se cierra si su artista ya no está en el mapa
  $('tip').style.display = 'none';
  sfx.remove();
  status('');
  render();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Delete' || e.target.tagName === 'INPUT') return;
  const sel = nodes.find(m => m.selected);
  if (sel) removeNode(sel);
});

function clearAll() { nodes.length = links.length = 0; byId.clear(); byName.clear(); showPanel(false); render(); status(''); }
$('clear').innerHTML = ICON.clear;
$('home').innerHTML = $('busy').querySelector('svg').outerHTML;  // el logo de Weave (estático)
$('home').querySelectorAll('.thread, .n').forEach(el => el.classList.remove('thread', 'n'));
$('home').onclick = () => { autoFit = false; fitIfNeeded(true); sfx.select(); };
$('clear').onclick = () => { listRun++; clearAll(); sfx.remove(); };
function toggleLabels() {
  showLabels = !showLabels; localStorage.setItem('weave-labels', showLabels ? '1' : '0');
  $('labels').setAttribute('aria-pressed', showLabels); sfx.select();
  render();
}
$('labels').innerHTML = ICON.label;
$('labels').setAttribute('aria-pressed', showLabels);
$('labels').onclick = toggleLabels;

// ---------- Indicador de trabajo ----------
let listRun = 0;  // se incrementa para cancelar una carga en curso
const sleep = ms => new Promise(r => setTimeout(r, ms));
let busyCount = 0;
function showBusy() {
  const b = $('busy');
  b.classList.toggle('on', busyCount > 0);
  b.classList.toggle('center', nodes.length === 0);
  b.classList.toggle('bar', nodes.length > 0);
}
// Envuelve una promesa: mientras haya alguna pendiente, el logo se anima
async function working(promise) {
  busyCount++; showBusy();
  try { return await promise; } finally { busyCount--; showBusy(); }
}

// ---------- Camino de x a y ----------
// /from A to B: el servidor busca la cadena de relacionadas que los une; los artistas entran uno a uno,
// ya completos, unidos por una línea dorada.
function runPath(a, b) { return working(tracePath(a, b)); }
async function tracePath(a, b) {
  const run = ++listRun;
  clearAll(); autoFit = true; showBusy();
  const path = await api(`/api/path?from=${a.id}&to=${b.id}`).catch(() => null);
  if (run !== listRun) return;
  if (!path) { flashError(); return; }
  const ids = path.map(x => x.id);
  const fulls = ids.map(id => getArtist(id).catch(() => null));  // se descargan en paralelo; entran en orden
  let prev = null;
  for (let i = 0; i < ids.length; i++) {
    const full = await fulls[i];
    if (run !== listRun) return;
    if (!full) continue;
    const n = addFull(full, null, i === 0 || i === ids.length - 1);
    // en fila de izquierda a derecha; luego la simulación lo curva a su gusto
    n.x = innerWidth * 0.12 + (innerWidth * 0.6) * i / Math.max(1, ids.length - 1); n.y = innerHeight / 2 + (i % 2 ? 40 : -40);
    if (prev) { addLink(prev, n); links[links.length - 1].path = true; }
    prev = n;
    render(); sfx.join(i); showBusy();
    await sleep(300);
  }
  sfx.chord(); wantFit = true;
  autoFit = false;
}

// Clic en el fondo: solo quita el resaltado; la ficha se queda con el último artista
svg.on('click', () => { nodes.forEach(m => m.selected = false); $('tip').style.display = 'none'; render(); });

// ?origen=Marea,Michael Jackson -> arranca con esos orígenes (enlace compartible)
async function originsFromUrl() {
  const names = (new URLSearchParams(location.search).get('origen') || '').split(',').map(s => s.trim()).filter(Boolean);
  for (const name of names) {
    const res = await api('/api/search?q=' + encodeURIComponent(name)).catch(() => []);
    if (res[0]) await addOrigin(res.find(r => norm(r.name) === norm(name)) || res[0]);
  }
}

originsFromUrl();
render();
</script>
